# AIOS Redis 总线配置
bind 0.0.0.0
protected-mode yes
port 6379

# 内存管理
maxmemory 4096mb
maxmemory-policy allkeys-lru

# AOF 持久化
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# 连接限制
timeout 300
tcp-keepalive 60
maxclients 10000

# 监控
slowlog-log-slower-than 10000
slowlog-max-len 128

# 密码（生产环境必须设置）
# requirepass ${REDIS_PASSWORD}
