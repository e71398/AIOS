# LiteLLM Proxy Config — AI Control Center V1
# Unified model gateway: Hermes → LiteLLM → MiniMax / DeepSeek

model_list:
  - model_name: MiniMax-M3
    litellm_params:
      model: openai/MiniMax-M3
      api_key: os.environ/MINIMAX_CN_API_KEY
      api_base: https://api.minimax.chat/v1
      rpm: 60
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: true
      input_cost_per_token: 0.0000005     # ¥0.5/M tokens
      output_cost_per_token: 0.0000018    # ¥1.8/M tokens

  - model_name: deepseek-chat
    litellm_params:
      model: openai/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
      api_base: https://api.deepseek.com
      rpm: 60
    model_info:
      mode: chat
      supports_function_calling: true
      input_cost_per_token: 0.00000027    # ¥0.27/M tokens
      output_cost_per_token: 0.0000011    # ¥1.1/M tokens

general_settings:
  master_key: sk-aios-master-key

litellm_settings:
  drop_params: true
  set_verbose: false
  disable_cost_tracking: false
  max_budget: 100.0
  budget_duration: 30d
