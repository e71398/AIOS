[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aios"
version = "0.1.0a3"
description = "AIOS 鈥?AI Agent Operating System"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "AIOS Contributors"}
]

dependencies = [
    "redis>=5.0",
    "psutil>=5.9",
    "requests>=2.31",
    "aiohttp>=3.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["kernel*", "aios*"]
namespaces = false

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "*.md", "*.sh", "*.service", "*.conf", "*.txt"]

[project.urls]
Homepage = "https://github.com/e71398/aios"
