# 2026-08-17 P1-HARD-001: AIOS core service hardening (aios-api-proxy)
# All leaf daemons can write to the same user-owned session / cache
# directories.
[Service]
MemoryMax=128M
MemoryHigh=96M
TasksMax=64
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=${HOME}/.openclaw ${HOME}/.hermes ${HOME}/.nvm ${HOME}/.cache ${HOME}/.local ${AIOS_HOME}/cache ${AIOS_HOME}/sandbox ${AIOS_HOME}/checkpoint ${AIOS_HOME}/logs ${AIOS_HOME}/tmp
PrivateTmp=true
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
NoNewPrivileges=true
LockPersonality=true
RestrictRealtime=true
RestrictSUIDSGID=true
SystemCallArchitectures=native
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
