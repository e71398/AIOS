# 2026-08-17 P1-HARD-001: AIOS core service hardening (verification gate profile)
# Verification Gate spawns reviewer subprocesses (openclaw, hermes) that
# need to write session bookkeeping.  Allow the same user-owned paths
# as the orchestrator.
[Service]
MemoryMax=128M
MemoryHigh=96M
TasksMax=64
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=${HOME}/.openclaw ${HOME}/.hermes ${HOME}/.nvm ${HOME}/.cache ${AIOS_HOME}/cache ${AIOS_HOME}/sandbox ${AIOS_HOME}/checkpoint ${AIOS_HOME}/logs ${AIOS_HOME}/tmp
PrivateTmp=true
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictNamespaces=true
NoNewPrivileges=true
LockPersonality=true
RestrictRealtime=true
RestrictSUIDSGID=true
SystemCallArchitectures=native
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
