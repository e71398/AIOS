# 2026-08-17 P1-HARD-001: AIOS core service hardening (orchestrator profile)
# Orchestrator runs the workflow loop + subprocess dispatch.  Memory budget
# accounts for ~50 child tasks resident in workflow hashes; allow generous
# MemoryMax but still cap to prevent runaway.
#
# Subprocesses (openclaw reviewer / codex executor / hermes verifier)
# inherit our restrictions.  They MUST be able to write to
# ${HOME}/.openclaw/agents/<agent>/sessions/ and
# ${HOME}/.hermes/... for session bookkeeping, so we lift the
# global ProtectHome=read-only and replace it with explicit
# ReadWritePaths= allowances.
[Service]
MemoryMax=512M
MemoryHigh=384M
TasksMax=256
ProtectSystem=strict
ProtectHome=read-only
# 2026-08-17 FIX_HARDENING: openclaw / hermes / codex subprocesses need
# to write session bookkeeping; allow specific user-owned paths.
ReadWritePaths=${HOME}/.openclaw ${HOME}/.hermes ${HOME}/.nvm ${HOME}/.cache ${AIOS_HOME}/cache ${AIOS_HOME}/sandbox ${AIOS_HOME}/checkpoint ${AIOS_HOME}/logs ${AIOS_HOME}/tmp
PrivateTmp=true
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictNamespaces=true
NoNewPrivileges=true
LockPersonality=true
RestrictRealtime=true
RestrictSUIDSGID=true
SystemCallArchitectures=native
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
