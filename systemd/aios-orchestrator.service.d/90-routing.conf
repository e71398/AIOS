# 2026-08-17 P1 routing-fix:
#   1. AIOS_ROUTING_SHADOW_MODE is True by default which means
#      production traffic from "openclaw" / "feishu" / "feishu-ws" /
#      "web" / "api" / "telegram" sources is recorded but never
#      actually dispatched to an executor.  Disable shadow mode so
#      production traffic actually runs.
#   2. AIOS_ROUTING_CANARY_ALLOWED_SOURCES extends the canary list
#      with the production sources so an operator who re-enables
#      shadow_mode for safety still has a way to mark production
#      traffic as "allowed to bypass shadow" without editing
#      aios_routing_policy.py.
[Service]
Environment="AIOS_ROUTING_SHADOW_MODE=false"
Environment="AIOS_ROUTING_CANARY_ALLOWED_SOURCES=test,aios-canary,openclaw,feishu,feishu-ws,feishu-webhook,web,api,telegram,system"
