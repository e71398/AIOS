# AIOS Unified Security Gate — Trivy drop-in (canonical).
#
# Deployed instance:
#   ~/.config/systemd/user/aios-capability-trivy.service.d/security-gate.conf
#
# This drop-in is the only place that defines the actual Trivy command lines.
# The base unit stays minimal (WorkingDirectory, sandboxing, limits) so this
# composition is reviewable in isolation.
#
# Two phases, fail-closed:
#   1. ExecStartPre downloads the vulnerability DB. Failure MUST abort the
#      service. There is intentionally no `-` prefix in front of the command
#      path, so systemd returns exit-code on DB failure and does NOT proceed
#      to scan with a stale DB.
#   2. ExecStart runs the filesystem scan using the just-updated local DB.
#      No `--skip-db-update` is used here: the precondition above guarantees
#      DB freshness, and the scan must always reflect the current DB state.
#
# Scan targets:
#   * ${AIOS_HOME} (the canonical AIOS repo root)
#
# Excluded directories (intentional, NOT a security bypass):
#   * checkpoint       — internal state snapshots, not source-of-truth code.
#   * logs             — runtime logs grow continuously; high-noise, low-signal.
#   * cache            — Trivy's own cache; not part of the repo surface.
#   * sandbox          — generated test artifacts; not production code.
#   * extensions/semgrep/rules, extensions/semgrep/venv — third-party data.
#   * extensions/agentshield/node_modules — third-party package data.
#   * extensions/trivy/bin — the Trivy binary itself.
#   * backup           — historical OpenClaw session JSON/JSONL files inside
#                        dated snapshots repeatedly triggered the analyzer's
#                        context deadline exceeded. Excluding backup keeps the
#                        scan bounded. This is NOT a clean-bill-of-health for
#                        backup contents; backup security and retention policy
#                        are tracked as a separate follow-up task.
#
# Reporting:
#   * Output JSON: ${AIOS_HOME}/logs/capabilities/trivy/aios-security.json
#     The JSON is regenerated on every successful run; a fresh mtime is the
#     evidence that the service actually completed with an updated DB.
[Unit]
Description=AIOS Unified Security Gate backend - Trivy supply-chain scan

[Service]
ExecStartPre=${AIOS_HOME}/extensions/trivy/bin/trivy image --cache-dir ${AIOS_HOME}/cache/capabilities/trivy --download-db-only
ExecStart=
ExecStart=${AIOS_HOME}/extensions/trivy/bin/trivy filesystem --cache-dir ${AIOS_HOME}/cache/capabilities/trivy --scanners vuln,secret,misconfig --skip-dirs ${AIOS_HOME}/checkpoint --skip-dirs ${AIOS_HOME}/logs --skip-dirs ${AIOS_HOME}/cache --skip-dirs ${AIOS_HOME}/sandbox --skip-dirs ${AIOS_HOME}/extensions/semgrep/rules --skip-dirs ${AIOS_HOME}/extensions/semgrep/venv --skip-dirs ${AIOS_HOME}/extensions/agentshield/node_modules --skip-dirs ${AIOS_HOME}/extensions/trivy/bin --skip-dirs ${AIOS_HOME}/backup --format json --output ${AIOS_HOME}/logs/capabilities/trivy/aios-security.json ${AIOS_HOME}
